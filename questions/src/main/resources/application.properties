spring.application.name=questions

# Server port - Railway injects PORT automatically, fallback to 8081 for local
server.port=${PORT:8081}

# Database - Railway provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD separately
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ShashankDB}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Allow large file uploads (PDFs)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


